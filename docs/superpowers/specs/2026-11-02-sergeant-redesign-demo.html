<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sergeant demo</title>
<style>
  :root{--bg:#f3f5f8;--card:#fff;--ink:#101418;--mute:#535b66;--line:#dfe3e9;--hero:#101418;--heroInk:#fff;--uni:#2f5fc4;--proj:#c0611a;--train:#b3303e;--err:#2e8459;--tint:#fff}
  body.ocean{--bg:#0b1b2b;--card:#12263b;--ink:#e8f2fb;--mute:#93a9bf;--line:#1e3a55;--hero:#1f6fb2;--heroInk:#fff;--uni:#7cc4ff;--proj:#ffb36b;--train:#ff8a96;--err:#6fe0b0;--tint:#12263b}
  body.forest{--bg:#eef2ec;--card:#fff;--ink:#14241a;--mute:#4f5f54;--line:#d6dfd4;--hero:#1f4d34;--heroInk:#fff;--uni:#2d5fb8;--proj:#b5651d;--train:#a8323f;--err:#2b7a4b;--tint:#fff}
  body.grape{--bg:#16121f;--card:#221b30;--ink:#f1ecfa;--mute:#a79bbd;--line:#33294a;--hero:#6d3fd1;--heroInk:#fff;--uni:#8fb0ff;--proj:#ffab6e;--train:#ff7d95;--err:#6fdca6;--tint:#221b30}
  body.mono{--bg:#ffffff;--card:#ffffff;--ink:#000;--mute:#444;--line:#000;--hero:#000;--heroInk:#fff;--uni:#1d4ed8;--proj:#b45309;--train:#b91c1c;--err:#15803d;--tint:#fff}
  body.mono .bk,body.mono .card{border:2px solid #000}
  body.dark{--bg:#0e1116;--card:#181c23;--ink:#eef1f5;--mute:#9aa3af;--line:#262c35;--hero:#2a3140;--heroInk:#fff;--uni:#7fa6ff;--proj:#ffa05c;--train:#ff7a85;--err:#5fd39a;--tint:#181c23}
  *{box-sizing:border-box}
  body{margin:0;background:#c9ced6;font-family:var(--font,system-ui),sans-serif;font-size:calc(16px*var(--scale,1));color:var(--ink);display:flex;flex-direction:column;align-items:center;padding:16px;gap:12px}
  .ctl{font-size:14px;color:var(--mute);display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center}
  .ctl button{font:inherit;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:pointer}
  .phone{font-family:var(--font,system-ui);zoom:var(--scale,1);width:var(--fw,360px);height:var(--fh,740px);border-radius:var(--fr,34px);border:9px solid #1b1b1f;container:app/inline-size;flex:none;background:var(--bg);overflow:hidden;position:relative;display:flex;flex-direction:column}
  .scr{flex:1;overflow-y:auto;padding-bottom:16px}
  .ph{padding:20px 16px 8px;display:flex;justify-content:space-between;align-items:flex-end}
  .ph .d{font-size:13px;color:var(--mute)} .ph .t{font-size:26px;font-weight:700}
  .ph .r{font-size:13px;color:var(--mute);text-align:right} .ph .r b{color:var(--ink);font-size:15px}
  .hero{margin:6px 16px 16px;padding:16px;border-radius:calc(var(--r,14px) + 6px);background:var(--hero);color:var(--heroInk)}
  .hero .l{font-size:13px;opacity:.75} .hero .n{font-size:21px;font-weight:700;margin:4px 0 2px} .hero .s{font-size:13px;opacity:.85}
  .prog{height:6px;border-radius:3px;background:#ffffff30;margin-top:12px;overflow:hidden} .prog i{display:block;height:100%;background:var(--bar,#f0a35e)}
  .acts{display:flex;gap:10px;margin-top:14px}
  .btn{flex:1;text-align:center;font:600 15px var(--font,system-ui);padding:12px 0;border-radius:12px;background:#fff;color:#17171a;border:0;cursor:pointer}
  .btn.g{background:transparent;color:#fff;border:1px solid #ffffff55}
  .hero.free{background:var(--card);color:var(--ink);border:1px dashed var(--line)}
  .sec{font-size:13px;font-weight:600;color:var(--mute);margin:0 16px 8px;min-height:18px;align-items:center;display:flex;justify-content:space-between}
  .list{padding:0 16px;display:flex;flex-direction:column;gap:var(--gap,10px)}
  .ev{display:flex;gap:12px}
  .tm{width:42px;font-size:13px;color:var(--mute);padding-top:13px;text-align:right;flex:none}
  .bk{flex:1;border-radius:var(--r,14px);padding:calc(var(--gap,10px) + 1px) 12px;background:var(--card);display:flex;gap:10px;align-items:center;cursor:pointer;color:var(--ink)}
  .ic{width:32px;height:32px;border-radius:10px;flex:none;display:grid;place-items:center;font-size:14px;font-weight:700;background:color-mix(in srgb,var(--c) 18%,var(--tint));color:var(--c)}
  .bk .n{font-weight:600;font-size:15px} .bk .s{font-size:13px;color:var(--mute);margin-top:1px}
  .done{opacity:.5} .done .n{text-decoration:line-through}
  .k-uni{--c:var(--uni)} .k-proj{--c:var(--proj)} .k-train{--c:var(--train)} .k-err{--c:var(--err)}
  .gap{font-size:13px;color:var(--mute);text-align:center;padding:8px 0;border:1px dashed var(--line);border-radius:12px;margin-left:54px;cursor:pointer}
  .add{display:block;width:calc(100% - 32px);margin:16px;font:600 15px var(--font,system-ui);padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
  .tabs{display:flex;justify-content:space-around;padding:8px 10px 14px;background:var(--card);border-top:1px solid var(--line)}
  .navb button{display:flex;flex-direction:column;align-items:center;gap:4px;font:600 11px var(--font,system-ui);background:none;border:0;color:var(--mute);cursor:pointer;min-width:64px}
  .tabs .pill{width:56px;height:32px;border-radius:16px;display:grid;place-items:center}
  .navb button.on{color:var(--ink)} .navb button.on .pill{background:color-mix(in srgb,var(--ink) 12%,transparent)}
  .tabs svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .sheetbg{position:absolute;inset:0;background:#0006;display:none;align-items:flex-end}
  .sheetbg.open{display:flex}
  .sheet{background:var(--card);color:var(--ink);width:100%;border-radius:22px 22px 0 0;padding:18px;display:flex;flex-direction:column;gap:14px}
  .sheet h3{margin:0;font-size:18px}
  .sheet input{font:16px system-ui;padding:12px;border-radius:12px;border:1px solid var(--line);width:100%;background:var(--bg);color:var(--ink)}
  .lab{font-size:13px;font-weight:600;color:var(--mute);margin-bottom:6px}
  .chips{display:flex;gap:8px;flex-wrap:wrap}
  .chip{font:600 14px var(--font,system-ui);padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
  .chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  .primary{font:600 16px var(--font,system-ui);padding:14px;border-radius:14px;border:0;background:var(--ink);color:var(--bg);cursor:pointer}
  .card{margin:0 16px 12px;background:var(--card);border-radius:calc(var(--r,14px) + 2px);padding:14px;display:flex;flex-direction:column;gap:10px}
  .prow{display:flex;gap:10px;align-items:center}
  .bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden} .bar i{display:block;height:100%;background:var(--c)}
  .wk{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding:0 10px}
  .wd{display:flex;flex-direction:column;gap:4px} .wd .h{font-size:12px;font-weight:600;text-align:center;color:var(--mute);padding:4px 0}
  .wd .h.today{color:var(--ink)}
  .wb{border-radius:8px;padding:5px 4px;font-size:11px;line-height:1.25;background:color-mix(in srgb,var(--c) 18%,var(--tint));color:var(--c);font-weight:600}
  .toast{position:absolute;left:16px;right:16px;bottom:70px;background:#17171a;color:#fff;padding:12px 14px;border-radius:12px;font-size:14px;display:none}
.c-outline .bk,.c-outline .card{background:transparent;border:1.5px solid var(--line)}
  .c-shadow .bk,.c-shadow .card{box-shadow:0 4px 14px #0000002a}
  .ic-dot .ic{width:12px;height:12px;font-size:0;background:var(--c)!important;border-radius:6px}
  .ic-none .ic{display:none}
  .nolabels .tl{display:none}
  .seg{display:flex;background:var(--line);border-radius:12px;padding:3px;gap:3px}
  .seg button{flex:1;font:600 14px var(--font,system-ui);padding:9px 0;border-radius:9px;border:0;background:transparent;color:var(--ink);cursor:pointer}
  .seg button.on{background:var(--card);box-shadow:0 1px 3px #0003}
  .optrow{display:flex;flex-direction:column;gap:6px}
  input[type=range]{width:100%}
.qa{display:flex;gap:8px;margin:0 16px 14px}
  .qa button{flex:1;font:600 14px var(--font,system-ui);padding:11px 0;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
  .over{margin:14px 16px 0;padding:14px;border-radius:calc(var(--r,14px) + 2px);border:1.5px dashed var(--line);display:flex;flex-direction:column;gap:8px}
  .toggle{display:flex;justify-content:space-between;align-items:center;font-size:15px}
  .toggle input{width:22px;height:22px}
.stage{width:100%;display:flex;justify-content:center;overflow:hidden}
  .stage>.fit{transform-origin:top center}
  .shell{flex:1;display:flex;flex-direction:column;min-height:0}
  .brand{display:none}
  .tg .c{display:none}
  .wwide{display:none}
  .wide{display:none}
  @container app (min-width:700px){
    .ph .t{font-size:30px}
    .wide{display:flex}
    .tg{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);grid-template-rows:auto auto 1fr;align-items:start;column-gap:16px;padding:0 16px}
    .tg .hd{grid-column:1 / -1} .tg .hd .ph{padding-left:0;padding-right:0}
    .tg .a{grid-column:1;grid-row:2} .tg .c{display:block;grid-column:1;grid-row:3;margin-top:8px} .tg .b{grid-column:2;grid-row:2 / span 2}
    .tg .sec{margin-left:0;margin-right:0} .tg .hero,.tg .card,.tg .qa,.tg .over{margin-left:0;margin-right:0} .tg .list{padding:0} .tg .add{width:100%;margin-left:0;margin-right:0}
    .tg .b .over,.tg .b .add{margin-left:54px;width:calc(100% - 54px)}
    .tg .c .sec{margin-top:16px} .tg .c .sec:first-child{margin-top:0}
    .wphone{display:none} .wwide{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;padding:0 16px}
    .setwrap{columns:2 300px;column-gap:16px;padding:0 16px} .setwrap>.card,.setwrap>div{break-inside:avoid;margin-left:0!important;margin-right:0!important} .setwrap .sec{break-after:avoid;margin-left:0;margin-right:0} .setwrap .add{width:100%}
    .sheetbg{align-items:center;justify-content:center} .sheet{max-width:460px;border-radius:22px}
    .toast{left:auto;right:24px;bottom:24px;width:320px}
  }
  /* 3 columns from landscape tablet up; labeled sidebar only on real desktop widths */
  @container app (min-width:1000px){
    .tg{grid-template-columns:minmax(280px,1fr) minmax(0,1.4fr) minmax(260px,1fr);grid-template-rows:auto 1fr}
    .tg .a{grid-column:1;grid-row:2} .tg .b{grid-column:2;grid-row:2} .tg .c{grid-column:3;grid-row:2;margin-top:0}
    .setwrap{columns:3 280px}
  }
  /* nav bar: position + alignment come from classes set in render() */
  .navb{display:flex;flex:1;gap:6px;justify-content:var(--na)}
  .navx{display:none}
  .phone.nv .shell,.phone.nv-left .shell{flex-direction:row}
  .phone.nv .tabs{flex-direction:column;justify-content:flex-start;align-items:stretch;padding:20px 8px;border-top:0;width:88px;gap:6px;flex:none}
  .phone.nv .navb{flex-direction:column}
  .phone.nv-left .tabs{order:-1;border-right:1px solid var(--line)}
  .phone.nv-right .tabs{order:1;border-left:1px solid var(--line)}
  .phone.nv-top .tabs{order:-1;border-top:0;border-bottom:1px solid var(--line)}
  .phone.nh .tabs{flex-direction:row;align-items:center;padding:8px 10px 12px}
  .phone.nh.nwide .tabs{padding:10px 20px}
  .phone.nh.nwide .navb button{flex-direction:row;gap:8px;font-size:14px;padding:0 6px}
  .phone.nh.nwide .brand{display:block;font-weight:800;font-size:18px;padding:0 18px 0 4px;color:var(--ink)}
  .phone.nfull .tabs{width:250px;padding:20px 14px;gap:14px}
  .phone.nfull .brand{display:block;font-weight:800;font-size:20px;padding:4px 6px 2px;color:var(--ink)}
  .phone.nfull .navb{flex:none}
  .phone.nfull .navb button{flex-direction:row;gap:10px;font-size:15px;justify-content:flex-start;padding:2px}
  .phone.nfull .tabs .pill{width:44px}
  .phone.nfull .tl{display:inline!important}
  .phone.nfull .navx{display:flex;flex-direction:column;gap:12px;flex:1;min-height:0;overflow:auto}
  .navx .nc{border-radius:var(--r,14px);padding:12px;background:color-mix(in srgb,var(--ink) 6%,transparent);display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--mute)}
  .navx .nc b{color:var(--ink);font-size:15px}
  .navx .nbtn{font:600 14px var(--font,system-ui);padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;text-align:left}
  .navx .foot{margin-top:auto}
  .sgrid{display:grid;gap:16px;padding:0 16px;align-items:start}
  .scol{display:flex;flex-direction:column;min-width:0}
  .sgrid .sec{margin-left:0;margin-right:0} .sgrid .card,.sgrid .add,.sgrid .scol>div{margin-left:0!important;margin-right:0!important} .sgrid .add{width:100%}
  .sgrid .scol>.sec:not(:first-child){margin-top:10px}
  .wcol{display:flex;flex-direction:column;gap:6px;min-width:0}
  .wcol .h{font-size:13px;font-weight:600;color:var(--mute);padding:6px 2px} .wcol .h b{display:block;font-size:20px;color:var(--ink)}
  .wcol.today .h b{color:var(--hero)}
  .wcard{border-radius:var(--r,14px);padding:8px;background:color-mix(in srgb,var(--c) 16%,var(--card));min-width:0}
  .wcard .n{font-size:13px;font-weight:600;color:var(--ink);overflow-wrap:anywhere} .wcard .s{font-size:12px;color:var(--mute)}
  .mini{display:flex;align-items:end;gap:6px;height:70px}
  .mini div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--mute)}
  .mini i{display:block;width:100%;border-radius:6px;background:var(--hero)}
</style></head>
<body>
<div class="ctl">Demo clock: <b id="clock"></b>
  <button onclick="shift(-30)">−30 min</button><button onclick="shift(30)">+30 min</button><button onclick="reset()">Reset</button> · Size: <button onclick="frame('phone')">Phone</button><button onclick="frame('tablet')">Tablet ↕</button><button onclick="frame('tabletL')">Tablet ↔</button><button onclick="frame('desktop')">Desktop</button><button onclick="frame('fit')">Fit window</button> · Phone is: <button id="sysb" onclick="sysDark=!sysDark;applyTheme();render();this.textContent=sysDark?'dark':'light'">?</button></div>

<div class="stage" id="stage"><div class="fit" id="fit"><div class="phone" id="frame">
  <div class="shell"><div class="scr" id="scr"></div>
  <div class="tabs" id="tabs"></div></div>
  <div class="toast" id="toast"></div>
  <div class="sheetbg" id="gbg" onclick="if(event.target===this)closeG()"><div class="sheet" id="gsheet"></div></div>
  <div class="sheetbg" id="sheetbg" onclick="if(event.target===this)closeSheet()">
    <div class="sheet">
      <h3>Add errand</h3>
      <input id="et" placeholder="What is it? e.g. Buy groceries">
      <div><div class="lab">How long?</div><div class="chips" id="dur"></div></div>
      <div><div class="lab">When?</div><div class="chips" id="when"></div></div>
      <button class="primary" onclick="saveErrand()">Add to today</button>
    </div>
  </div>
</div></div></div>

<script>
let clock24=true;
const fmt=m=>{const h=Math.floor(m/60),mm=String(m%60).padStart(2,'0');return clock24?`${h}:${mm}`:`${(h+11)%12+1}:${mm}${h<12?'am':'pm'}`};
const DAY_START=540, DAY_END=1260;
const K={uni:'U',proj:'P',train:'T',err:'E'}, KN={uni:'Uni',proj:'Side project',train:'Training',err:'Errand'};
let brk=null, dayOff=null, override=false;
let now, blocks, tab='today', dur=30, when='anytime';
function reset(){now=14*60+40;blocks=[
  {id:1,k:'uni',n:'CPEN448 lab report',s:540,e:630,done:true},
  {id:2,k:'uni',n:'CPEN426 class',s:660,e:735,done:true,fixed:true},
  {id:3,k:'proj',n:'Sergeant app',s:840,e:930,focus:true},
  {id:4,k:'err',n:'Pick up package',s:960,e:980},
  {id:6,k:'uni',n:'CPEN426 A3 study',s:990,e:1080},
  {id:5,k:'train',n:'Muay Thai',s:1110,e:1260,fixed:true,sub:'19:00–20:30 · drive 30 min each way'},
];brk=null;dayOff=null;override=false;render()}
function shift(d){now=Math.max(DAY_START,Math.min(DAY_END,now+d));render()}
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>el.style.display='none',2200)}
function sorted(){return blocks.slice().sort((a,b)=>a.s-b.s)}
const live=b=>!b.done&&!b.over&&!b.moved;
function current(){return sorted().find(b=>live(b)&&b.s<=now&&now<b.e)}
function next(){return sorted().find(b=>live(b)&&b.s>now)}
function gaps(){const out=[];let t=DAY_START;for(const b of sorted().filter(b=>!b.moved&&!b.over)){if(b.s-t>=30)out.push([t,b.s]);t=Math.max(t,b.e)}if(DAY_END-t>=30)out.push([t,DAY_END]);return out}
function done(id){blocks.find(b=>b.id===id).done=true;toast('Nice. Marked done.');render()}
function skip(id){const b=blocks.find(b=>b.id===id);b.s=now;b.e=now;b.done=true;b.skipped=true;toast('Skipped. The scheduler will find this time later this week.');render()}

const isWork=b=>!b.fixed&&(b.k==='uni'||b.k==='proj');
function markLimit(){let acc=0;for(const b of sorted()){b.over=false;if(!isWork(b)||b.moved)continue;const len=b.e-b.s;
  if(!override&&!b.done&&((lay.limitH&&acc+len>lay.limitH*60)||(lay.stopAt&&b.e>lay.stopAt)))b.over=true;else acc+=len}return acc}
function today(){
  if(brk&&now>=brk.until)brk=null;
  const used=markLimit();
  const c=current(), nx=next(), vis=sorted().filter(b=>!b.moved&&!b.over&&!b.skipped);
  const planned=vis.reduce((s,b)=>s+(b.e-b.s),0), overB=sorted().filter(b=>b.over);
  let h=`<div class="tg"><div class="hd"><div class="ph"><div><div class="d">Mon 3 Nov</div><div class="t">Today</div></div>
    <div class="r">${fmt(DAY_START)} → <b>${fmt(lay.stopAt&&!override?Math.min(lay.stopAt,DAY_END):DAY_END)}</b><br>${Math.floor(planned/60)}h ${planned%60}m planned</div></div></div><div class="a"><div class="sec wide"><span>Right now</span></div>`;
  if(dayOff){
    h+=`<div class="hero"><div class="l">Day off</div><div class="n">Rest today</div><div class="s">${dayOff.n} block${dayOff.n===1?'':'s'} moved to later this week${dayOff.keep?' · fixed times kept':''}</div>
      <div class="acts"><button class="btn" onclick="undoDayOff()">Undo</button></div></div>`;
  } else if(brk){
    const left=brk.until-now;
    h+=`<div class="hero"><div class="l">Break · back at ${fmt(brk.until)}</div><div class="n">Take a breather</div><div class="s">${left} min left · the rest of today moved ${brk.d} min later</div>
      <div class="prog"><i style="width:${Math.round((brk.d-left)/brk.d*100)}%"></i></div>
      <div class="acts"><button class="btn" onclick="brk=null;render()">End break early</button></div></div>`;
  } else if(c){const left=c.e-now,p=Math.round((now-c.s)/(c.e-c.s)*100);
    h+=`<div class="hero"><div class="l">Now · ${KN[c.k]} · ends ${fmt(c.e)}</div><div class="n">${c.n}</div>
      <div class="s">${left} min left${c.focus?' · other notifications blocked':''}</div>
      <div class="prog"><i style="width:${p}%"></i></div>
      <div class="acts"><button class="btn" onclick="done(${c.id})">Done</button><button class="btn g" onclick="skip(${c.id})">Skip</button></div></div>`;
  } else {
    h+=`<div class="hero free"><div class="l" style="color:var(--mute)">Free now</div><div class="n">${nx?`Next: ${nx.n}`:'Day is done'}</div>
      <div class="s" style="color:var(--mute)">${nx?`starts ${fmt(nx.s)}, in ${nx.s-now} min`:'Nothing left today'}</div></div>`;
  }
  if(!dayOff)h+=`<div class="qa"><button onclick="openBreak()">Take a break</button><button onclick="openDayOff()">Day off</button></div>`;
  if(lay.limitH&&!dayOff)h+=`<div class="sec"><span>Work today</span><span>${Math.floor(used/60)}h ${used%60}m of ${lay.limitH}h${override?' · limit off today':''}</span></div>`;
  h+=`</div><div class="b"><div class="sec"><span>Rest of today</span></div><div class="list">`;
  let t=DAY_START;
  for(const b of vis){
    if(b.s-t>=30&&b.s>now&&!dayOff)h+=`<div class="gap" onclick="openSheet()">free ${fmt(Math.max(t,now))}–${fmt(b.s)} · tap to add</div>`;

  <div style="display:flex;gap:10px;margin:0 16px 12px"><button class="primary" style="flex:1" onclick="saveMine()">${editing?'Save changes':'Save as my theme'}</button>${editing?`<button class="add" style="margin:0;width:auto;padding:14px 18px" onclick="delMine()">Delete</button>`:`<button class="add" style="margin:0;width:auto;padding:14px 18px" onclick="resetAll()">Reset all</button>`}</div>
  <div class="sec"><span>Schedule</span></div>
  <div class="card"><b>Fixed weekly times</b><div style="font-size:14px;color:var(--mute)">Muay Thai · Mon Wed Fri · 19:00–20:30 · drive 30 min<br>Gym · Tue 17:00 · Thu 18:30 · Sat 11:00</div></div>
  <div class="sec"><span>Work limit</span></div>
  <div class="card">
    <div class="optrow"><div class="lab">Max study + project time a day · ${lay.limitH?lay.limitH+'h':'off'}</div><input type="range" min="0" max="12" value="${lay.limitH}" oninput="lay.limitH=+this.value" onchange="render()"></div>
    <div class="optrow"><div class="lab">Stop working at</div>${seg('stopAt',[[0,'Off'],[1080,'18:00'],[1140,'19:00'],[1200,'20:00'],[1260,'21:00'],[1320,'22:00']])}</div>
    <div style="font-size:13px;color:var(--mute)">Past the limit, work moves to tomorrow. Today shows a "Keep going today" button if you want to push on.</div>
  </div>
  <div class="card"><b>Focus blocks</b><div style="font-size:14px;color:var(--mute)">Do Not Disturb during study and side-project blocks: On</div></div></div>`}

function render(){
  document.getElementById('clock').textContent=fmt(now);
  document.getElementById('scr').innerHTML={today,projects,week,settings}[tab]();
  const I={today:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',week:'<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/>',projects:'<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',settings:'<path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/>'};
  const fr=document.getElementById('frame'), fw=fr.clientWidth;
  const pos=lay.nav==='auto'?(fw>=700?'left':'bottom'):lay.nav, vert=pos==='left'||pos==='right';
  const full=vert&&(lay.side==='full'||(lay.side==='auto'&&fw>=1260));
  fr.className=`phone nv-${pos} ${vert?'nv':'nh'} ${full?'nfull':''} ${!vert&&fw>=700?'nwide':''}`;
  fr.style.setProperty('--na',{start:'flex-start',center:'center',end:'flex-end',spread:vert?'flex-start':'space-around'}[lay.navAlign==='auto'?(vert?'start':'spread'):lay.navAlign]);
  document.getElementById('tabs').innerHTML='<div class="brand">Sergeant</div><div class="navb">'+[['today','Today'],['week','Week'],['projects','Projects'],['settings','Settings']]
    .map(([k,l])=>`<button class="${tab===k?'on':''}" onclick="tab='${k}';render()"><span class="pill"><svg viewBox="0 0 24 24">${I[k]}</svg></span><span class="tl">${l}</span></button>`).join('')+'</div>'+(full?navx():'');
}
function navx(){const c=!dayOff&&!brk&&current(), used=markLimit();
  return `<div class="navx">
    ${tab==='today'?'':`<div class="nc">${brk?`<span>On a break</span><b>Back at ${fmt(brk.until)}</b>`:dayOff?`<span>Today</span><b>Day off</b>`:c?`<span>Now · ends ${fmt(c.e)}</span><b>${c.n}</b><span>${c.e-now} min left</span><div class="bar"><i style="width:${Math.round((now-c.s)/(c.e-c.s)*100)}%;background:var(--bar)"></i></div>`:`<span>Free now</span><b>${next()?'Next: '+next().n:'Day is done'}</b>`}</div>`}
    <button class="nbtn" onclick="openSheet()">+ Add errand</button>
    <button class="nbtn" onclick="openBreak()">Take a break</button>
    ${lay.limitH&&tab!=='today'?`<div class="nc"><span>Work today</span><b>${Math.floor(used/60)}h ${used%60}m of ${lay.limitH}h</b><div class="bar"><i style="width:${Math.min(100,used/(lay.limitH*60)*100)}%;background:var(--proj)"></i></div></div>`:''}
    <div class="nc"><span>Next deadline</span><b>CPEN448 lab report</b><span>due Thu · 2 of 4 blocks</span></div>
    <div class="foot"><div class="seg">${[['system','Auto'],['light','Light'],['dark','Dark']].map(([v,l])=>`<button class="${modePref===v?'on':''}" onclick="setMode('${v}')">${l}</button>`).join('')}</div></div>
  </div>`}

function chips(id,opts,cur,set){document.getElementById(id).innerHTML=opts.map(([v,l])=>`<button class="chip ${v===cur?'on':''}" data-v="${v}">${l}</button>`).join('');
  document.getElementById(id).onclick=e=>{const v=e.target.closest('[data-v]')?.dataset.v;if(!v)return;set(isNaN(v)?v:+v);openSheet(true)}}
function openSheet(keep){if(!keep){document.getElementById('et').value='';dur=30;when='anytime'}
  chips('dur',[[15,'15 min'],[30,'30 min'],[60,'1 h']],dur,v=>dur=v);
  chips('when',[['anytime','Anytime today'],['now','Right now'],['pick','Pick a time']],when,v=>when=v);
  document.getElementById('sheetbg').classList.add('open')}
function closeSheet(){document.getElementById('sheetbg').classList.remove('open')}
function saveErrand(){
  const n=document.getElementById('et').value.trim()||'Errand';let s;
  if(when==='now')s=now;
  else if(when==='pick'){const v=prompt('Start time (HH:MM)','17:00');if(!v)return;const[a,b]=v.split(':');s=+a*60+(+b||0)}
  else{const g=gaps().find(([a,b])=>Math.max(a,now)+dur<=b);if(!g){toast('No free gap today. Try tomorrow.');return}s=Math.max(g[0],now);s=Math.ceil(s/5)*5}
  blocks.push({id:Date.now(),k:'err',n,s,e:s+dur});closeSheet();toast(`${n} placed at ${fmt(s)}`);render()}
applyTheme();document.getElementById('sysb').textContent=sysDark?'dark':'light';
let fmode='phone';
const FR={phone:[360,740,34],tablet:[820,1100,22],tabletL:[1180,820,22],desktop:[1440,860,14]};
function frame(m){fmode=m||fmode;const f=document.getElementById('frame'),fit=document.getElementById('fit');
  let [w,h,r]=fmode==='fit'?[innerWidth-32,innerHeight-120,14]:FR[fmode];
  f.style.setProperty('--fw',w+'px');f.style.setProperty('--fh',h+'px');f.style.setProperty('--fr',r+'px');
  const sc=Math.min(1,(innerWidth-32)/(w+18));fit.style.transform=`scale(${sc})`;document.getElementById('stage').style.height=(h+18)*sc+'px';if(blocks)render()}
addEventListener('resize',()=>frame());
frame('phone');
reset();
</script>
</body></html>
